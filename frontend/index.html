<!DOCTYPE html>
<html lang="es" translate="no">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit + user-scalable=no: en las tablets de cocina un pellizco
         accidental deja la pantalla con un zoom que nadie sabe deshacer. El
         tamaño se ajusta desde la configuración de la pantalla, no con gestos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="Punto de venta y pantalla de cocina para restaurantes."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!-- Para que en iPad "Añadir a pantalla de inicio" abra sin barra de Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orden+" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Google Fonts para un diseño más hogareño -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Comfortaa:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <title>Orden+ · Gestión Restaurante</title>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
